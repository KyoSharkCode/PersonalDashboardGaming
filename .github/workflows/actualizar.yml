name: Actualizar Stats del Dashboard

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar stats (LoL)
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python actualizar_stats.py

      - name: Actualizar estado Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python live_twitch.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name 'StatsBot'
          git config --global user.email 'statsbot@github.com'
          git add datos_lol.json live_twitch.json
          git diff --staged --quiet || git commit -m "Actualizacion automatica de stats"
          git push
