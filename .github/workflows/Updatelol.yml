name: Actualizar datos de LoL

on:
  workflow_dispatch:   # disparado manualmente o vía API (ej. tu cron-job externo)

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar datos_lol.json
        env:
          # El secret se llama RIOT_API_KEY_PERSONAL en este repo para no
          # confundirlo con la key permanente de tu otro proyecto.
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY_PERSONAL }}
        run: python actualizar_stats.py

      - name: Commitear datos_lol.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_lol.json
          git diff --staged --quiet || git commit -m "Actualizar datos_lol.json [skip ci]"
          git push
